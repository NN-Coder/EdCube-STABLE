<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | EdCube</title>
    <link rel="icon" href="logo.jpg" type="image/x-icon">

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css"> 
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-EZJ4RW4BH4"></script>
    <script>
      const game_width = "Ry1FWko0Ulc0Qkg0";
      const game_height = atob(game_width);
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', game_height);
    </script>
    
    <canvas id="spaceCanvas"></canvas>

    <script>
        const canvas = document.getElementById('spaceCanvas');
        const ctx = canvas.getContext('2d');
        
        let stars = [];
        let isEnabled = true; 
        
        let mouse = {
            x: null,
            y: null,
            radius: Math.min(window.innerWidth, window.innerHeight) * 0.15 
        };
        
        window.addEventListener('mousemove', (e) => { mouse.x = e.x; mouse.y = e.y; });
        window.addEventListener('mouseout', () => { mouse.x = null; mouse.y = null; });
        window.addEventListener('touchmove', (e) => {
            if(e.touches.length > 0) {
                mouse.x = e.touches[0].clientX;
                mouse.y = e.touches[0].clientY;
            }
        });
        window.addEventListener('touchend', () => { mouse.x = null; mouse.y = null; });
        
        window.addEventListener('keydown', (e) => {
            if (e.key.toLowerCase() === 'k') {
                isEnabled = !isEnabled;
                
                if (isEnabled) {
                    canvas.classList.remove('hidden');
                    animate();
                } else {
                    canvas.classList.add('hidden');

                }
            }
        });
        
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            mouse.radius = Math.min(canvas.width, canvas.height) * 0.15;
            if (mouse.radius < 100) mouse.radius = 100;
        }
        
        window.addEventListener('resize', resize);
        resize();
        
        class Star {
            constructor() { this.init(true); }
        
            init(isInitial = false) {
                this.x = Math.random() * canvas.width;
                this.y = isInitial ? Math.random() * canvas.height : canvas.height + 10;
                this.size = Math.random() * 1.2 + 0.3;
                this.baseSpeedY = (Math.random() * 0.15 + 0.05) * -1;
                this.baseSpeedX = (Math.random() - 0.5) * 0.05;
                this.speedY = this.baseSpeedY;
                this.speedX = this.baseSpeedX;
                this.opacity = Math.random() * 0.8 + 0.2;
        
                const hue = Math.random();
                if (hue < 0.2) this.color = `rgba(180, 220, 255,`;
                else if (hue < 0.4) this.color = `rgba(255, 180, 255,`;
                else if (hue < 0.6) this.color = `rgba(180, 255, 220,`;
                else this.color = `rgba(255, 255, 255,`;
            }
        
            update() {
                let dx = mouse.x - this.x;
                let dy = mouse.y - this.y;
                let distance = Math.sqrt(dx * dx + dy * dy);
        
                if (distance < mouse.radius && mouse.x !== null) {
                    const force = (mouse.radius - distance) / mouse.radius;
                    this.x -= (dx / distance) * force * 3;
                    this.y -= (dy / distance) * force * 3;
                }
        
                this.y += this.speedY;
                this.x += this.speedX;
        
                if (this.y < -10) this.init(false);
                if (this.x < 0) this.x = canvas.width;
                if (this.x > canvas.width) this.x = 0;
        
                if (Math.random() > 0.99) this.opacity = Math.random() * 0.8 + 0.2;
            }
        
            draw() {
                ctx.fillStyle = `${this.color} ${this.opacity})`;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        function setup() {
            stars = [];
            const dynamicCount = window.innerWidth < 600 ? 120 : 200;
            for (let i = 0; i < dynamicCount; i++) { stars.push(new Star()); }
        }
        
        function animate() {
            if (!isEnabled) return;
        
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(star => {
                star.update();
                star.draw();
            });
            requestAnimationFrame(animate);
        }
        
        setup();
        animate();
    </script>
    
    <!-- Header -->
    <header class="site-header">
        <div class="header-content">
            <div class="header-left">
                <img src="logo.jpg" alt="EdCube Logo" class="logo-img" loading="lazy">
            </div>
            <nav class="header-right">
                <!-- <a href="#" class="nav-icon-link" title="Proxies">
                    <i data-lucide="globe"></i>
                    <span>Proxies</span>
                </a> -->
                <button class="nav-icon-link" onclick="openBlank()">
                    <i data-lucide="external-link"></i>
                    <span>Cloak</span>
                </button>
                <a href="#" class="nav-icon-link" >
                    <i data-lucide="settings"></i>
                    <span>Settings</span>
                </a>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-wrapper">

        <!-- Hero Banner -->
        <section class="hero-banner">
            <h1>Welcome to EdCube!</h1>
            <p>EdCube v5.0 Release on Monday, March 30!</p>
            <p>Be sure to join the <a href="https://discord.gg/WkhHFKq8Z3">Discord</a> server for news and exclusive updates!</p>

        </section>

        <!-- Featured Games Carousel -->
        <section class="featured-section">
            <h2 class="section-subtitle" style="text-align: center;">Featured Games</h2>
            <div class="carousel-container">
                <button class="carousel-arrow prev" onclick="moveSlide(-1)">
                    <i data-lucide="chevron-left"></i>
                </button>
                
                <div class="carousel-track-container">
                    <div class="carousel-track" id="carouselTrack"></div>
                </div>

                <button class="carousel-arrow next" onclick="moveSlide(1)">
                    <i data-lucide="chevron-right"></i>
                </button>
            </div>
        </section>

        <section class="game-library">
            <h2 class="section-subtitle" style="text-align: center;">All Games</h2>

            <!-- Search -->
            <div class="search-container">
                <div class="search-box">
                    <i data-lucide="search" class="search-icon"></i>
                    <input type="text" id="gameSearch" placeholder="Search games..." class="search-input-field">
                </div>
            </div>
            <div id="noResults" style="display: none; text-align: center; margin-top: 20px; color: #00ffcc; opacity: 0.7;">
                No games found matching your search.
            </div>

            <!-- Game Grid -->
            <div class="game-grid"></div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <div class="footer-content">
            <p>Copyright © 2024-2026 All Rights Reserved by EdCube.</p>
        </div>
    </footer>

   <script>
        // Lucide icons
        lucide.createIcons();
        
        let allGames = [];
        let currentSlide = 0;
        let autoScrollTimer;

        // Open in About:Blank
        function openBlank() {
            const win = window.open();
            if (!win) {
                alert("Please allow popups to use this feature.");
                return;
            }
            const url = window.location.href;
            const iframe = win.document.createElement('iframe');
            
            iframe.style.width = "100%";
            iframe.style.height = "100%";
            iframe.style.border = "none";
            iframe.style.position = "fixed";
            iframe.style.top = "0";
            iframe.style.left = "0";
            iframe.src = url;
            
            win.document.body.style.margin = "0";
            win.document.body.appendChild(iframe);
        }

         // Gets games from JSON and starts carousel and games grid
        async function initEdCube() {
            try {
                const response = await fetch('games/games.json');
                allGames = await response.json();
                
                renderCarousel(allGames.slice(0, 3)); // Feature first 3 games
                renderGrid(allGames);
                resetTimer();
            } catch (error) {
                console.error("Error loading games.json:", error);
                document.querySelector('.game-grid').innerHTML = "<p>Failed to load game library.</p>";
            }
        }

         // Dynamic carousel slides from featured games
        function renderCarousel(featuredGames) {
            const track = document.getElementById('carouselTrack');
            track.innerHTML = featuredGames.map((game, index) => `
                <div class="carousel-slide ${index === 0 ? 'active' : ''}" 
                     style="background-image: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('${game.image}');">
                    <div class="slide-content">
                        <div class="slide-info-box">
                            <h3 class="slide-title">${game.title}</h3>
                            <div class="slide-expandable-content">
                                <p class="slide-description">${game.description || 'Experience this amazing game. Try it now!'}</p>
                                <a href="games/game.html?id=${game.id}" class="nav-btn slide-play-btn">Play Now</a>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

         // Renders game cards into games grid
        function renderGrid(gamesToDisplay) {
            const grid = document.querySelector('.game-grid');
            grid.innerHTML = ''; 

            gamesToDisplay.forEach(game => {
                const card = document.createElement('a');
                card.href = `games/game.html?id=${game.id}`;
                card.className = 'game-card';
                
                card.innerHTML = `
                    <div class="card-inner">
                        <div class="card-thumb" style="background-image: url('${game.image}');" loading="lazy"></div>
                        <div class="card-overlay">
                            <span class="card-title">${game.title}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // Carousel controls
        function showSlide(index) {
            const slides = document.querySelectorAll('.carousel-slide');
            if (slides.length === 0) return;
            
            slides.forEach(slide => slide.classList.remove('active'));
            currentSlide = (index + slides.length) % slides.length;
            slides[currentSlide].classList.add('active');
        }

        function moveSlide(step) {
            showSlide(currentSlide + step);
            resetTimer(); 
        }

        function resetTimer() {
            clearInterval(autoScrollTimer);
            autoScrollTimer = setInterval(() => {
                showSlide(currentSlide + 1);
            }, 5000);
        }

        // Search logic
        document.getElementById('gameSearch').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = allGames.filter(game => 
                game.title.toLowerCase().includes(term)
            );
            
            renderGrid(filtered);
            const noResults = document.getElementById('noResults');
            noResults.style.display = filtered.length === 0 ? 'block' : 'none';
        });

        window.addEventListener('DOMContentLoaded', initEdCube);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>

    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700&display=swap" rel="stylesheet">

<body>
    
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-EZJ4RW4BH4"></script>
    <script>
      const game_width = "Ry1FWko0Ulc0Qkg0";
      const game_height = atob(game_width);
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

    <!-- Header -->
    <header class="site-header">
        <div class="header-content">
            <div class="header-left">

                </a>
            </div>
            <nav class="header-right">
                <button class="nav-icon-link" onclick="openBlank()">
                    <i data-lucide="external-link"></i>
                    <span>Cloak</span>
                </button>
                <a href="../home.html" class="nav-icon-link">
                    <i data-lucide="home"></i>

        </div>
    </header>

    <main class="main-wrapper">
        <section class="game-section">
            <h1 class="game-title" id="displayTitle">Loading...</h1>

            <!-- Game Frame -->
            <div class="iframe-container">
                <iframe src="" id="gameFrame" allowfullscreen></iframe>
                
                <!-- Options Bar -->
                <div class="options-bar">
                    <button class="nav-icon-link" id="fullscreenBtn" title="Fullscreen (F)">
                        <i data-lucide="maximize"></i>
                    </button>
                    <button class="nav-icon-link" id="shareBtn" title="Share">

                    </button>

        <section class="recommended-section">
            <h2 class="section-subtitle">Recommended Games</h2>
